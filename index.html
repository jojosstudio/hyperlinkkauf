<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyperlink</title>
  <style>
    :root {
      --bg: #121212;
      --text: #f0f0f0;
      --card: #1e1e1e;
      --accent: #34c759;
      --hover: #007745;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header img {
      max-height: 40px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0;
    }

    .question {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .product-selection {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    @media (min-width: 600px) {
      .product-selection {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
    }

    .product {
      background-color: var(--card);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .product:hover {
      background-color: #2a2a2a;
      transform: scale(1.02);
    }

    .product img {
      max-width: 100px;
      height: auto;
      margin-bottom: 10px;
    }

    .product h3 {
      margin: 10px 0 5px;
      font-size: 1rem;
    }

    .product p,
    .product s,
    .product h4 {
      margin: 0;
      font-size: 0.9rem;
    }

    .Einrichtung {
      margin-top: 30px;
      text-align: center;
    }

    .Einrichtung a {
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      display: inline-block;
      transition: background-color 0.3s ease;
    }

    .Einrichtung a:hover {
      background-color: var(--hover);
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo" />
    <h1>Hyperlink</h1>
  </header>

  <div class="question">Welchen Router möchtest du?</div>

  <div class="product-selection">
    <div class="product" onclick="goToProduct('rt1', 'Hyperlink 1.0', '99.99', 'router1.jpg')">
      <img src="router1.png" alt="Router 1" />
      <h3>Hyperlink 1.0</h3>
      <h4 style="color: red;">Sale!</h4>
      <s>€130</s>
      <p>€99.99</p>
    </div>
    <div class="product" onclick="goToProduct('rt2', 'Hyperlink 1.0 Pro', '199.99', 'router2.jpg')">
      <img src="router2.png" alt="Router 2" />
      <h3>Hyperlink 1.0 Pro</h3>
      <h4>Für Gamer</h4>
      <p>€199.99</p>
    </div>
    <div class="product" onclick="goToProduct('rt3', 'Test Hyperlink', '0', 'router2.jpg')">
      <img src="router3.png" alt="Router 3" />
      <h3>Test Hyperlink</h3>
      <p>Kostenlos</p>
    </div>
  </div>

  <div class="Einrichtung">
    <a href="einrichtungrt1.html">Router einrichten</a>
  </div>

  <script>
    function goToProduct(productId, productName, productPrice, productImage) {
      const url = `${productId}.html?product=${productId}&name=${encodeURIComponent(productName)}&price=${productPrice}&image=${productImage}`;
      window.location.href = url;
    }
  </script>
</body>
</html>
