<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyperlink Konfigurator</title>
  <style>
    :root {
      --bg-dark: #121212;
      --text-light: #f0f0f0;
      --accent: #34c759;
      --hover: #007745;
      --transition: 0.4s ease-in-out;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    header {
      text-align: center;
      padding: 20px;
    }

    header img {
      height: 40px;
    }

    .container {
      display: flex;
      justify-content: space-between;
      margin: 20px auto;
      max-width: 1200px;
      padding: 20px;
    }

    .product-image {
      text-align: center;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .product-image img {
      max-width: 80%;
      height: auto;
    }

    .setup-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      margin-top: 20px;
      background-color: #1e1e1e;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .step {
      max-width: 500px;
      margin: 40px auto;
      text-align: center;
      display: none;
      opacity: 0;
      transform: translateY(-30px);
      transition: var(--transition);
    }

    .step.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .step h2 {
      margin-bottom: 20px;
      animation: fadeIn 1s forwards;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .setup-buttons {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .button-option {
      background-color: #1e1e1e;
      color: var(--text-light);
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s;
      flex: 1 1 calc(33.333% - 20px);
      text-align: center;
    }

    .button-option:hover {
      background-color: var(--hover);
      transform: scale(1.05);
    }

    .button-option.selected {
      background-color: var(--accent);
    }

    .summary {
      margin-top: 30px;
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .setup-section {
        margin-top: 20px;
        align-items: center;
      }

      .button-option {
        flex: 1 1 100%;
      }
    }

    @media (max-width: 600px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .setup-section {
        margin-top: 20px;
        align-items: center;
      }

      .button-option {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo" />
    <h1>Hyperlink Konfigurator</h1>
  </header>

  <div class="container">
    <div class="product-image">
      <img src="router3.png" alt="Produktbild" />
    </div>

    <div class="setup-section">
      <div id="step1" class="step active">
        <h2>Speicher wählen</h2>
        <div class="setup-buttons">
          <div class="button-option" onclick="selectOption('storage', 0)">Standard</div>
          <div class="button-option" onclick="selectOption('storage', 50)">+ 50 € - 512 GB</div>
          <div class="button-option" onclick="selectOption('storage', 100)">+ 100 € - 1 TB</div>
        </div>
      </div>

      <div id="step2" class="step">
        <h2>LAN-Modul wählen</h2>
        <div class="setup-buttons">
          <div class="button-option" onclick="selectOption('lan', 0)">Standard</div>
          <div class="button-option" onclick="selectOption('lan', 50)">+ 50 € - Gaming LAN</div>
        </div>
      </div>

      <div id="step3" class="step">
        <h2>WLAN-Modul wählen</h2>
        <div class="setup-buttons">
          <div class="button-option" onclick="selectOption('wlan', 0)">Standard</div>
          <div class="button-option" onclick="selectOption('wlan', 100)">+ 100 € - WiFi 7</div>
        </div>
      </div>

      <div id="step4" class="step">
        <h2>Deine Angaben</h2>
        <input type="text" placeholder="Name" id="name" />
        <input type="email" placeholder="E-Mail" id="email" />
        <input type="tel" placeholder="Telefon" id="phone" />
        <div class="summary" id="summary"></div>
        <button onclick="submitForm()">Jetzt Kaufen</button>
      </div>
    </div>
  </div>

  <script>
    let selectedOptions = {
      storage: 0,
      lan: 0,
      wlan: 0
    };

    function selectOption(type, price) {
      // Set selected option and highlight the active button
      selectedOptions[type] = price;

      // Highlight selected button
      const buttons = document.querySelectorAll(`#${type} .button-option`);
      buttons.forEach((button) => {
        button.classList.remove('selected');
      });

      // Find the clicked button and mark it as selected
      const selectedButton = event.target;
      selectedButton.classList.add('selected');

      // Move to the next step if it exists
      const currentStep = document.querySelector('.step.active');
      const nextStepId = `step${parseInt(currentStep.id.replace('step', '')) + 1}`;
      const nextStep = document.getElementById(nextStepId);
      
      if (nextStep) {
        currentStep.classList.remove('active');
        nextStep.classList.add('active');
      }

      // Update the summary and total price in the last step
      if (nextStepId === 'step4') {
        const total = 99.99 + selectedOptions.storage + selectedOptions.lan + selectedOptions.wlan;
        document.getElementById('summary').innerText = `Gesamtpreis: €${total.toFixed(2)}`;
      }
    }

    function submitForm() {
      alert("Bestellung abgeschickt!");
      // Weiterleitung oder Absenden kannst du hier einbauen
    }
  </script>
</body>
</html>
