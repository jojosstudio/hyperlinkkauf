<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyperlink Konfigurator</title>
  <style>
    :root {
      --bg-dark: #121212;
      --text-light: #f0f0f0;
      --accent: #34c759;
      --hover: #007745;
      --transition: 0.4s ease-in-out;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    header {
      text-align: center;
      padding: 20px;
    }

    header img {
      height: 40px;
    }

    .container {
      display: flex;
      justify-content: space-between;
      margin: 20px auto;
      max-width: 1200px;
      padding: 20px;
    }

    .step {
      max-width: 500px;
      margin: 40px auto;
      text-align: center;
      display: none;
      opacity: 0;
      transform: translateY(-30px);
      transition: var(--transition);
    }

    .step.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .step h2 {
      margin-bottom: 20px;
      animation: fadeIn 1s forwards;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    select, input, button {
      width: 90%;
      padding: 15px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #1e1e1e;
      color: var(--text-light);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: var(--hover);
    }

    .product-image {
      text-align: center;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .product-image img {
      max-width: 80%;
      height: auto;
    }

    .summary {
      margin-top: 30px;
    }

    .setup-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      margin-top: 20px;
    }

    .setup-section a {
      color: var(--accent);
      text-decoration: none;
      margin-top: 20px;
      font-size: 18px;
      transition: color 0.3s;
    }

    .setup-section a:hover {
      color: var(--hover);
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .setup-section {
        margin-top: 20px;
        align-items: center;
      }

      select, input, button {
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .setup-section {
        margin-top: 20px;
        align-items: center;
      }

      select, input, button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo" />
    <h1>Hyperlink Konfigurator</h1>
  </header>

  <div class="container">
    <div class="product-image">
      <img src="router1.png" alt="Produktbild" />
    </div>

    <div class="step-container">
      <div id="step1" class="step active">
        <h2>Speicher wählen</h2>
        <select id="storage" onchange="nextStep(2)">
          <option value="">Bitte wählen</option>
          <option value="0">Standard</option>
          <option value="50">+ 50 € - 512 GB</option>
          <option value="100">+ 100 € - 1 TB</option>
        </select>
      </div>

      <div id="step2" class="step">
        <h2>LAN-Modul wählen</h2>
        <select id="lan" onchange="nextStep(3)">
          <option value="">Bitte wählen</option>
          <option value="0">Standard</option>
          <option value="50">+ 50 € - Gaming LAN</option>
        </select>
      </div>

      <div id="step3" class="step">
        <h2>WLAN-Modul wählen</h2>
        <select id="wlan" onchange="nextStep(4)">
          <option value="">Bitte wählen</option>
          <option value="0">Standard</option>
          <option value="100">+ 100 € - WiFi 7</option>
        </select>
      </div>

      <div id="step4" class="step">
        <h2>Deine Angaben</h2>
        <input type="text" placeholder="Name" id="name" />
        <input type="email" placeholder="E-Mail" id="email" />
        <input type="tel" placeholder="Telefon" id="phone" />
        <div class="summary" id="summary"></div>
        <button onclick="submitForm()">Jetzt Kaufen</button>
      </div>
    </div>

    <div class="setup-section">
    </div>
  </div>

  <script>
    function nextStep(step) {
      const current = document.querySelector(".step.active");
      current.classList.remove("active");
      document.getElementById("step" + step).classList.add("active");

      if (step === 4) {
        const storage = parseInt(document.getElementById("storage").value) || 0;
        const lan = parseInt(document.getElementById("lan").value) || 0;
        const wlan = parseInt(document.getElementById("wlan").value) || 0;
        const total = 99.99 + storage + lan + wlan;

        document.getElementById("summary").innerText = `Gesamtpreis: €${total.toFixed(2)}`;
      }
    }

    function submitForm() {
      alert("Bestellung abgeschickt!");
      // Weiterleitung oder Absenden kannst du hier einbauen
    }
  </script>
</body>
</html>
